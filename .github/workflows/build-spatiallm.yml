name: Build SpatialLM Docker Image

on:
  push:
    paths:
      - 'gaussian-splat/handler_spatiallm.py'
      - 'gaussian-splat/Dockerfile.spatiallm'
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: schwengerryan7
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./gaussian-splat
          file: ./gaussian-splat/Dockerfile.spatiallm
          push: true
          tags: schwengerryan7/spatiallm:latest
